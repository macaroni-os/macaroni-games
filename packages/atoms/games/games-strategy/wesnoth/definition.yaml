name: wesnoth
version: 1.18.0
category: games-strategy
use_flags:
- dbus
- -dedicated
- server
requires:
- name: boost
  version: '>=0'
  category: dev-libs
- name: libsdl2
  version: '>=0'
  category: media-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Battle for Wesnoth - A fantasy turn-based strategy game
uri:
- http://www.wesnoth.org https://github.com/wesnoth/wesnoth
license: GPL-2
labels:
  BDEPEND: sys-devel/gettext virtual/pkgconfig dev-util/ninja dev-util/cmake
  DEPEND: dev-libs/boost:=[bzip2,context,icu,nls] >=media-libs/libsdl2-2.0.4:0[joystick,video,X]
    !dedicated? ( dev-libs/glib:2 dev-libs/openssl:0= >=media-libs/fontconfig-2.4.1
    >=media-libs/sdl2-image-2.0.0[jpeg,png] >=media-libs/sdl2-mixer-2.0.0[vorbis]
    media-libs/libvorbis >=x11-libs/pango-1.22.0 >=x11-libs/cairo-1.10.0 sys-libs/readline:0=
    dbus? ( sys-apps/dbus ) ) x11-libs/libX11 dev-util/desktop-file-utils x11-misc/shared-mime-info
    sys-apps/shadow
  IUSE: dbus dedicated doc nls server
  RDEPEND: dev-libs/boost:=[bzip2,context,icu,nls] >=media-libs/libsdl2-2.0.4:0[joystick,video,X]
    !dedicated? ( dev-libs/glib:2 dev-libs/openssl:0= >=media-libs/fontconfig-2.4.1
    >=media-libs/sdl2-image-2.0.0[jpeg,png] >=media-libs/sdl2-mixer-2.0.0[vorbis]
    media-libs/libvorbis >=x11-libs/pango-1.22.0 >=x11-libs/cairo-1.10.0 sys-libs/readline:0=
    dbus? ( sys-apps/dbus ) )
  emerge.packages: games-strategy/wesnoth
  kit: geaaru-kit
  original.package.name: games-strategy/wesnoth
  original.package.slot: "0"
  original.package.version: 1.18.0
