name: freeciv
version: 2.6.0
category: games-strategy
use_flags:
- -dedicated
- qt5
- auth
- gtk
- ipv6
- mapimg
- modpack
- readline
- sdl
- server
- sound
- sqlite
- nls
requires:
- name: bzip2
  version: '>=0'
  category: app-arch
- name: mysql-connector-c
  version: '>=0'
  category: dev-db
- name: sqlite
  version: '>=0'
  category: dev-db-3
- name: lua
  version: '>=0'
  category: dev-lang
- name: qtcore
  version: '>=0'
  category: dev-qt-5
- name: qtgui
  version: '>=0'
  category: dev-qt-5
- name: qtwidgets
  version: '>=0'
  category: dev-qt-5
- name: imagemagick
  version: '>=0'
  category: media-gfx
- name: libpng
  version: '>=0'
  category: media-libs
- name: sdl2-gfx
  version: '>=0'
  category: media-libs
- name: sdl2-image
  version: '>=0'
  category: media-libs
- name: sdl2-mixer
  version: '>=0'
  category: media-libs
- name: sdl2-ttf
  version: '>=0'
  category: media-libs
- name: curl
  version: '>=0'
  category: net-misc
- name: libtool
  version: '>=0'
  category: sys-devel-2
- name: libintl
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: multiplayer strategy game (Civilization Clone)
uri:
- http://www.freeciv.org/
license: GPL-2+
labels:
  BDEPEND: virtual/pkgconfig !dedicated? ( x11-base/xorg-proto nls? ( sys-devel/gettext
    ) )
  DEPEND: app-arch/bzip2 app-arch/xz-utils net-misc/curl sys-libs/zlib auth? ( !mysql?
    ( ( !sqlite? ( dev-db/mysql-connector-c:0= ) ) ) mysql? ( dev-db/mysql-connector-c:0=
    ) sqlite? ( dev-db/sqlite:3 ) ) dedicated? ( aimodules? ( dev-libs/libltdl:0 )
    ) !dedicated? ( media-libs/libpng:0 gtk? ( x11-libs/gtk+:2 ) mapimg? ( media-gfx/imagemagick:=
    ) modpack? ( x11-libs/gtk+:2 ) nls? ( virtual/libintl ) qt5? ( dev-qt/qtcore:5
    dev-qt/qtgui:5 dev-qt/qtwidgets:5 ) !sdl? ( !gtk? ( x11-libs/gtk+:2 ) ) sdl? (
    media-libs/libsdl2[video] media-libs/sdl2-gfx media-libs/sdl2-image[png] media-libs/sdl2-ttf
    ) server? ( aimodules? ( sys-devel/libtool:2 ) ) sound? ( media-libs/libsdl2[sound]
    media-libs/sdl2-mixer[vorbis] ) ) readline? ( sys-libs/readline:0= ) system-lua?
    ( >=dev-lang/lua-5.3:= ) dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: aimodules auth dedicated +gtk ipv6 mapimg modpack mysql nls qt5 readline sdl
    +server +sound sqlite system-lua
  RDEPEND: app-arch/bzip2 app-arch/xz-utils net-misc/curl sys-libs/zlib auth? ( !mysql?
    ( ( !sqlite? ( dev-db/mysql-connector-c:0= ) ) ) mysql? ( dev-db/mysql-connector-c:0=
    ) sqlite? ( dev-db/sqlite:3 ) ) dedicated? ( aimodules? ( dev-libs/libltdl:0 )
    ) !dedicated? ( media-libs/libpng:0 gtk? ( x11-libs/gtk+:2 ) mapimg? ( media-gfx/imagemagick:=
    ) modpack? ( x11-libs/gtk+:2 ) nls? ( virtual/libintl ) qt5? ( dev-qt/qtcore:5
    dev-qt/qtgui:5 dev-qt/qtwidgets:5 ) !sdl? ( !gtk? ( x11-libs/gtk+:2 ) ) sdl? (
    media-libs/libsdl2[video] media-libs/sdl2-gfx media-libs/sdl2-image[png] media-libs/sdl2-ttf
    ) server? ( aimodules? ( sys-devel/libtool:2 ) ) sound? ( media-libs/libsdl2[sound]
    media-libs/sdl2-mixer[vorbis] ) ) readline? ( sys-libs/readline:0= ) system-lua?
    ( >=dev-lang/lua-5.3:= )
  emerge.packages: games-strategy/freeciv
  kit: games-kit
  original.package.name: games-strategy/freeciv
  original.package.slot: "0"
  original.package.version: 2.6.0-r1
